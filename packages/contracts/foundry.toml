[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 20

[rpc_endpoints]
og_mainnet = "${OG_RPC_URL}"
og_galileo = "${OG_TESTNET_RPC_URL}"
